baseurl: '/'
permalink: pretty
title: 'Leanne Fortney'
email: 'leannefortneyartist@gmail.com'
description: 'Artist & Innovation Facilitator, Leanne Fortney, supports individuals and teams in overcoming stuck thinking, activating new perspectives, and turning ideas into meaningful, real-world solutions.'
logo:
  mobile: "Logo.png"
  mobile_height: "24px"
  mobile_width: "120px"
  desktop: "Logo.png"
  desktop_height: "64px"
  desktop_width: "160px"
social:
  facebook: 'https://www.facebook.com/ArtistLeanneFortney'
  instagram: 'https://www.instagram.com/leannefortney_art'
  tiktok: 'https://www.tiktok.com/@leannefortney'
home: 
  limit_services: 6
collections:
  services:
    output: true
    sort_by: weight
  team:
    output: true
defaults:
  - scope:
      path: ""
      type: "services"
    values:
      layout: "service"
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team"
sass:
  style: compressed
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-environment-variables
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - LICENSE.md
  - LICENSE
  - README.md
