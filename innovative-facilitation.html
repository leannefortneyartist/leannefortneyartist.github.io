<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Innovative Facilitation – Leanne Fortney</title>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200;300&family=Open+Sans:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <style>
    .facilitation-section {
      max-width: 800px;
      margin: 0 auto;
      padding: 4rem 2rem;
      text-align: center;
    }
    .page-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 200;
      font-size: 2rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #000000;
      margin-bottom: 1rem;
      border-bottom: 1px solid #e0d9d3;
      padding-bottom: 1rem;
    }
    .tagline {
      font-family: 'Oswald', sans-serif;
      font-weight: 200;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: #3a3530;
      margin: 2rem 0 1.5rem;
    }
    .description {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 300;
      color: #1a1a1a;
      line-height: 1.9;
      margin-bottom: 1.5rem;
    }
    .divider {
      width: 48px;
      height: 1px;
      background: #c4b8ae;
      margin: 2.5rem auto;
    }
    .coming-soon {
      font-family: 'Oswald', sans-serif;
      font-weight: 200;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #8a7d72;
      margin-bottom: 1.5rem;
    }
    .inquiry-text {
      font-family: 'Open Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 300;
      color: #1a1a1a;
      line-height: 1.8;
      margin-bottom: 2rem;
    }
    .inquiry-button {
      display: inline-block;
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 0.85rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #ffffff;
      background: #3a3530;
      padding: 0.9rem 2.5rem;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.2s;
    }
    .inquiry-button:hover {
      background: #000000;
    }
    .image-container {
      margin: 3rem 0;
    }
    .image-container img {
      width: 100%;
      max-width: 600px;
      border-radius: 4px;
    }
  </style>
